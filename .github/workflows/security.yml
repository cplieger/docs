# Dependency and vulnerability review. Hand-maintained: this repo has no
# go.mod, jsr.json or Dockerfile, so the sync does not deliver it. Renovate
# bumps the pin through the `# v3` comment.
name: Security

on:
  pull_request:
    paths:
      - "**/*.sh"
      - "**/compose.yaml"
      - "**/Dockerfile*"
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: cplieger/ci/.github/workflows/security-scan.yaml@41a0e59beb76d13a7669f8102a59c1059a3273de # v3
