# Dependency and vulnerability review. Hand-maintained: this repo has no
# go.mod, jsr.json or Dockerfile, so the sync does not deliver it. Renovate
# bumps the pin through the `# v3` comment.
name: Security

on:
  pull_request:
    paths:
      - "**/*.sh"
      - "**/compose.yaml"
      - "**/Dockerfile*"
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: cplieger/ci/.github/workflows/security-scan.yaml@4a909a2262795347b9aebe38b9ce0fa27e4ca837 # v3
