# Lint gate. Calls the central cplieger/ci meta workflow, which detects this
# repo's surfaces (Markdown, workflows, shell, YAML, Python) and emits the
# required `ci / validate` check. No paths filter, so the required check
# always reports. Hand-maintained: this repo has no go.mod, jsr.json or
# Dockerfile, so the sync does not deliver it. Renovate bumps the pin through
# the `# v3` comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The dead-code check uploads its findings to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: cplieger/ci/.github/workflows/ci.yaml@a00f6a5e8124eb98c625ac86083900dcadc22c00 # v3
