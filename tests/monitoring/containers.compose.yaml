# Test-only services added to examples/monitoring/stack with examples/monitoring/containers.
# None of the example's services change.
services:
  sink:
    image: python:3.15.2-alpine
    command: ["python3", "/sink.py"]
    volumes:
      - "${DOCS_ROOT}/tests/sink.py:/sink.py:ro"
    ports:
      - "127.0.0.1:8080:8080"

  # Runs for 20 seconds, exits and starts again, so ContainerRestarting fires for it.
  crash-loop:
    image: busybox:1.38.0
    container_name: crash-loop
    command: ["sh", "-c", "sleep 20; exit 1"]
    restart: always

  # A child process fills the memory limit and the kernel stops it; the container itself stays up.
  oom-worker:
    image: busybox:1.38.0
    container_name: oom-worker
    mem_limit: 32m
    memswap_limit: 32m
    command: ["sh", "-c", "while true; do (tail /dev/zero); sleep 30; done"]
