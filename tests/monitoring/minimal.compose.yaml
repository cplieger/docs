# Test-only services added to examples/monitoring/minimal. None of the example's services change.
services:
  sink:
    image: python:3.14.6-alpine
    command: ["python3", "/sink.py"]
    volumes:
      - "${DOCS_ROOT}/tests/sink.py:/sink.py:ro"
    ports:
      - "127.0.0.1:8080:8080"

  # knell with no settings exits with an error and restarts. Its shipped rule KnellExitedWithError alerts on that.
  knell:
    image: ghcr.io/cplieger/knell:latest
    container_name: knell
    restart: always
